<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingia - DalaliFasta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    .logo { text-align: center; font-size: 28px; font-weight: 800; color: #0d47a1; margin-bottom: 8px; }
    .logo span { color: #ffb300; }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #1565c0; }
    .btn-submit { width: 100%; padding: 12px; background-color: #1565c0; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #0d47a1; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
    .auth-footer a { color: #1565c0; text-decoration: none; font-weight: bold; }
    .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; }
    .alert-error { background-color: #ffebee; color: #c62828; }
    .alert-success { background-color: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">🏠 Dalali<span>Fasta</span></div>
    <p class="subtitle">Ingia kwenye akaunti yako kuendelea</p>

    <div id="alert-msg" class="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Barua Pepe (Email)</label>
        <input type="email" id="email" placeholder="juma@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Neno la Siri (Password)</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-login">Ingia</button>
    </form>

    <div class="auth-footer">
      Huna akaunti bado? <a href="register.html">Jisajili hapa</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const alertMsg = document.getElementById('alert-msg');
    const btnLogin = document.getElementById('btn-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnLogin.disabled = true;
      btnLogin.innerText = 'Inaingia...';
      alertMsg.style.display = 'none';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alertMsg.className = 'alert alert-error';
        alertMsg.innerText = 'Kosa la kuingia: ' + error.message;
        alertMsg.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.innerText = 'Ingia';
      } else {
        alertMsg.className = 'alert alert-success';
        alertMsg.innerText = 'Umeingia kikamilifu! Inarudi kwenye ukurasa mkuu...';
        alertMsg.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
