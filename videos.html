<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video za Mali - DalaliFasta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: white; padding-bottom: 40px; }

    header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .navbar { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo-text { font-size: 22px; font-weight: 800; color: white; text-decoration: none; }
    .logo-text span { color: #16a34a; }
    .nav-links a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 14px; }
    .nav-links a:hover { color: white; }

    .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
    .video-feed-title { text-align: center; margin-bottom: 24px; font-size: 24px; font-weight: 800; color: #f8fafc; }

    .video-card { background: #1e293b; border-radius: 16px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); }
    .video-player { width: 100%; max-height: 400px; background: black; object-fit: cover; display: block; }
    
    .video-info { padding: 16px; }
    .video-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
    .video-desc { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }

    .agent-row { display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
    .agent-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .agent-details { font-size: 13px; color: #cbd5e1; }
    .agent-name { font-weight: 700; color: white; }

    .status-msg { text-align: center; padding: 50px; color: #94a3b8; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="logo-text">🏠 Dalali<span>Fasta</span></a>
      <ul class="nav-links" style="list-style: none; display: flex; gap: 20px;">
        <li><a href="index.html">Nyumbani</a></li>
        <li><a href="agent-dashboard.html">Dashboard</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <h1 class="video-feed-title">🎬 Video za Mali Moto Moto</h1>
    <div id="video-feed-container">
      <div class="status-msg">Inapakia video za madalali...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAgentVideos() {
      const container = document.getElementById('video-feed-container');

      const { data, error } = await supabaseClient
        .from('agent_videos')
        .select(`
          *,
          agents:agent_id (
            full_name,
            phone_number,
            avatar_url
          )
        `)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="status-msg" style="color:#ef4444;">Kosa la kupakia video: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="status-msg">Hakuna video zilizopostiwa na madalali kwa sasa.</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const agent = item.agents || {};
        const agentName = agent.full_name || 'Dalali';
        const agentPhone = agent.phone_number || 'Haijawekwa';
        const initial = agentName.charAt(0).toUpperCase();

        const avatarHtml = agent.avatar_url
          ? `<img src="${agent.avatar_url}" class="agent-avatar" alt="${agentName}">`
          : `<div class="agent-avatar">${initial}</div>`;

        return `
          <div class="video-card">
            <video controls class="video-player" src="${item.video_url}"></video>
            <div class="video-info">
              <div class="video-title">${item.title}</div>
              <div class="video-desc">${item.description || 'Hakuna maelezo ya ziada.'}</div>
              
              <div class="agent-row">
                ${avatarHtml}
                <div class="agent-details">
                  <div class="agent-name">${agentName}</div>
                  <div>📞 Simu: ${agentPhone}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadAgentVideos();
  </script>
</body>
</html>
