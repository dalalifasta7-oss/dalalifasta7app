<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usajili kwa Email - DalaliFasta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 20px; padding: 30px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h1 { color: #2563eb; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .tab-switch { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; color: #64748b; background: transparent; }
    .tab-btn.active { background: #ffffff; color: #2563eb; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
    .form-control:focus { border-color: #2563eb; }
    .btn-action { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn-action:hover { background: #1d4ed8; }
    .form-container { display: none; }
    .form-container.active { display: block; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <h1>DalaliFasta</h1>
      <p id="form-subtitle">Sajili akaunti yako kwa Email na Namba ya Simu</p>
    </div>

    <div class="tab-switch">
      <button class="tab-btn active" onclick="switchTab('register')">Sajili Dalali</button>
      <button class="tab-btn" onclick="switchTab('login')">Ingia (Login)</button>
    </div>

    <!-- 1. FOMU YA KUSAJILI -->
    <div class="form-container active" id="register-form-box">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Jina Kamili</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Mfano: Juma Msuya" required>
        </div>

        <div class="form-group">
          <label>Barua Pepe (Email)</label>
          <input type="email" id="reg-email" class="form-control" placeholder="dalali@gmail.com" required>
        </div>

        <div class="form-group">
          <label>Namba ya Simu</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="0712345678" required>
        </div>

        <div class="form-group">
          <label>Maelezo Mafupi (Bio)</label>
          <input type="text" id="reg-bio" class="form-control" placeholder="Dalali wa Nyumba na Viwanja">
        </div>

        <button type="submit" class="btn-action" id="reg-btn">Tengeneza Akaunti & Nenda Dashboard</button>
      </form>
    </div>

    <!-- 2. FOMU YA KUINGIA (LOGIN) -->
    <div class="form-container" id="login-form-box">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Ingiza Email Yako</label>
          <input type="email" id="login-email" class="form-control" placeholder="dalali@gmail.com" required>
        </div>

        <button type="submit" class="btn-action" id="login-btn">Ingia Kwenye Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(type) {
      const tabs = document.querySelectorAll('.tab-btn');
      const regBox = document.getElementById('register-form-box');
      const loginBox = document.getElementById('login-form-box');

      if (type === 'register') {
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        regBox.classList.add('active');
        loginBox.classList.remove('active');
      } else {
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
        loginBox.classList.add('active');
        regBox.classList.remove('active');
      }
    }

    // USAJILI KUTUMIA EMAIL NA TAARIFA ZOTE
    async function handleRegister(e) {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const phone = document.getElementById('reg-phone').value.trim();
      const bio = document.getElementById('reg-bio').value.trim();
      const btn = document.getElementById('reg-btn');

      btn.disabled = true;
      btn.innerText = "Inasajili...";

      try {
        // Hakikisha Email haijatumika
        const { data: existingUser } = await supabaseClient
          .from('users')
          .select('*')
          .eq('email', email)
          .maybeSingle();

        if (existingUser) {
          alert("Email hii tayari imeshasajiliwa! Ingia (Login).");
          switchTab('login');
          document.getElementById('login-email').value = email;
          return;
        }

        // Hifadhi data kwenye public.users
        const { data: newUser, error } = await supabaseClient
          .from('users')
          .insert([
            {
              full_name: name,
              email: email,
              phone_number: phone,
              bio: bio || 'Dalali wa Nyumba na Viwanja',
              role: 'agent'
            }
          ])
          .select()
          .single();

        if (error) throw error;

        // Hifadhi Session kwenye Kifaa
        localStorage.setItem('dalali_user', JSON.stringify(newUser));

        alert("🎉 Usajili umekamilika! Unapelekwa kwenye Dashboard yako...");
        window.location.href = 'agent-dashboard.html';

      } catch (err) {
        alert("Imeshindikana kusajili: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Tengeneza Akaunti & Nenda Dashboard";
      }
    }

    // LOGIN KUTUMIA EMAIL
    async function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = "Inahakiki...";

      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('email', email)
          .maybeSingle();

        if (error) throw error;

        if (!user) {
          alert("Email hii haijapatikana! Tafadhali jisajili kwanza.");
          switchTab('register');
          document.getElementById('reg-email').value = email;
          return;
        }

        localStorage.setItem('dalali_user', JSON.stringify(user));
        alert(`Karibu tena ${user.full_name}!`);
        window.location.href = 'agent-dashboard.html';

      } catch (err) {
        alert("Kosa: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Ingia Kwenye Dashboard";
      }
    }
  </script>
</body>
</html>
